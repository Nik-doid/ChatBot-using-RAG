<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with API</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }

        h2 {
            color: #444;
            text-align: center;
            margin-bottom: 20px;
        }

        h3 {
            color: #555;
            margin-top: 30px;
        }

        /* Form Styles */
        #chat-form {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 0 auto;
        }

        #chat-form label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #666;
        }

        #chat-form input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }

        #chat-form button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        #chat-form button:hover {
            background-color: #0056b3;
        }

        /* Response Styles */
        #response {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 20px auto;
            font-size: 16px;
            line-height: 1.5;
            color: #333;
        }

        /* Error Message */
        #response.error {
            color: #dc3545;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h2>Ask a Question</h2>

    <!-- HTML Form (Posts to FastAPI) -->
    <form id="chat-form">
        <label for="query">Enter your question:</label>
        <input type="text" id="query" name="query" required>
        <button type="submit">Send</button>
    </form>

    <h3>Response:</h3>
    <p id="response"></p>

    <script>
        document.getElementById("chat-form").addEventListener("submit", async function(event) {
            event.preventDefault(); // Prevent page reload

            const formData = new FormData(this);
            const responseElement = document.getElementById("response");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                responseElement.innerText = data.response;
                responseElement.classList.remove("error"); // Remove error class if present
            } catch (error) {
                responseElement.innerText = "Error: " + error.message;
                responseElement.classList.add("error"); // Add error class for styling
            }
        });
    </script>
</body>
</html>
